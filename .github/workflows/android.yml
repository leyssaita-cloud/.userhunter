name: UserHunter Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userhunter-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK packages
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Expand uploaded project archive (phone-only setup)
        shell: bash
        run: |
          if [[ ! -f settings.gradle.kts && -f UserHunter-project.zip ]]; then
            unzip -q -o UserHunter-project.zip -d .
          fi
          test -f settings.gradle.kts || {
            echo "settings.gradle.kts was not found. Upload the project files or UserHunter-project.zip to the repository root."
            exit 1
          }

      - name: Run unit tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: UserHunter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
